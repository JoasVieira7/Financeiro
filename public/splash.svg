<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  
  <defs>
    <linearGradient id="fluxoEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D26A" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="fluxoSparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#00D26A" />
    </linearGradient>
    <linearGradient id="fluxoBgSatin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0FDF4" />
    </linearGradient>
    <filter id="fluxoShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#00D26A" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Fundo Limpo Fintech -->
  <rect width="1080" height="1920" fill="#FAFCFA" />
  
  <!-- Brilho radial esmeralda suave no centro -->
  <circle cx="540" cy="883.2" r="427.68" fill="#34D399" fill-opacity="0.06" />

  <!-- Anel de radar elegante ao redor do squircle -->
  <rect x="402.192" y="745.392" width="275.616" height="275.616" rx="87.43679999999999" fill="none" stroke="#10B981" stroke-opacity="0.2" stroke-width="2" />

  <!-- Squircle da Marca com Sombra Acetinada -->
  <rect x="421.2" y="764.4000000000001" width="237.6" height="237.6" rx="76.032" fill="#FFFFFF" stroke="#E2FBEA" stroke-width="2.5" filter="url(#fluxoShadow)" />

  <!-- Símbolo Central -->
  
  <g transform="translate(473.472, 816.672) scale(3.0240000000000005)">
    <!-- Sparkle Star 1 -->
    <path
      d="M21 9C21 11.2 19.8 12.8 17.5 13.5C19.8 14.2 21 15.8 21 18C21 15.8 22.2 14.2 24.5 13.5C22.2 12.8 21 11.2 21 9Z"
      fill="url(#fluxoSparkleGrad)"
    />
    <!-- Sparkle Star 2 -->
    <path
      d="M30 7.5C30 8.8 29.3 9.8 28 10.2C29.3 10.6 30 11.6 30 13C30 11.6 30.7 10.6 32 10.2C30.7 9.8 30 8.8 30 7.5Z"
      fill="url(#fluxoSparkleGrad)"
    />
    <!-- Linha Dinâmica de Crescimento -->
    <path
      d="M11 29L18.5 21.5L24 27L33.5 15.5"
      stroke="url(#fluxoEmeraldGrad)"
      stroke-width="3.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Seta Ascendente -->
    <path
      d="M27.5 15.5H33.5V21.5"
      stroke="url(#fluxoEmeraldGrad)"
      stroke-width="3.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
  

  <!-- Tipografia Oficial -->
  <text x="540" y="1085.16" text-anchor="middle" fill="#0F172A" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="57.023999999999994" font-weight="800" letter-spacing="-0.5">
    Fluxo Financeiro
  </text>
  <text x="540" y="1139.808" text-anchor="middle" fill="#64748B" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="26.136" font-weight="600" letter-spacing="1.5">
    GESTÃO INTELIGENTE &amp; METAS REAIS
  </text>
</svg>