<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#06080F" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00F59B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Icon Surface -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1F293D" stroke-width="8" />

  <!-- Inner Soft Radial Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#10B981" stroke-opacity="0.12" stroke-width="32" />

  <!-- Dynamic Zap / Lightning Bolt Symbol with Neon Emerald Gradient -->
  <path d="M280 96 L160 272 L256 272 L232 416 L352 240 L256 240 Z" 
        fill="url(#emeraldGrad)" 
        filter="url(#glow)" />
</svg>

